services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lavifort-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://lavifort:lavifort@postgres:5432/lavifort?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    ports:
      - '127.0.0.1:3001:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const net=require('net'); const s=net.connect(3000,'127.0.0.1');
          s.on('connect',()=>{s.end();process.exit(0)});
          s.on('error',()=>process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: lavifort-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lavifort
      POSTGRES_PASSWORD: lavifort
      POSTGRES_DB: lavifort
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - lavifort_api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lavifort -d lavifort']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  lavifort_api_pgdata:
